<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแบบทดสอบโต้ตอบ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 24px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .stage-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .question-number {
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: 600;
        }

        /* กล่องแสดงข้อความเตือน/ให้กำลังใจ */
        .encouragement-box {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
        }

        .encouragement-box.info {
            background-color: #eef6ff;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }

        .encouragement-box.good {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .encouragement-box.warn {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .question-text {
            font-size: 1.15rem;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 600;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background-color: #fff;
            color: #333;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f5f7fa;
            border-color: #2196f3;
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: #4caf50 !important;
            color: #2e7d32 !important;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #ffebee !important;
            border-color: #ef5350 !important;
            color: #c62828 !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #2196f3;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #1976d2;
        }

        .btn-secondary {
            background-color: #eceff1;
            color: #455a64;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #cfd8dc;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- ส่วนหัวข้อด่าน และแสดงเลขข้อ -->
    <div class="header-info">
        <div class="stage-title" id="stageTitle">ด่านที่ 1</div>
        <div class="question-number" id="questionNumber">(ข้อที่ 1/5)</div>
    </div>

    <!-- แถบแจ้งเตือน / ให้กำลังใจ (อัปเดตตัวเลขเรียลไทม์) -->
    <div id="encouragementContainer"></div>

    <!-- คำถาม -->
    <div class="question-text" id="questionText">กำลังโหลดคำถาม...</div>

    <!-- ตัวเลือกตอบ -->
    <div class="options-group" id="optionsGroup"></div>

    <!-- ปุ่มนำทาง -->
    <div class="nav-controls">
        <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">ข้อก่อนหน้า</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">ข้อถัดไป</button>
    </div>
</div>

<script>
    // ข้อมูลแบบทดสอบตัวอย่าง
    const quizData = [
        {
            stage: 1,
            stageName: "ด่านที่ 1: ความรู้ทั่วไป",
            questions: [
                { id: 101, question: "1. ประเทศไทยมีกี่ฤดูหลัก?", options: ["2 ฤดู", "3 ฤดู", "4 ฤดู", "5 ฤดู"], answer: 1 },
                { id: 102, question: "2. เมืองหลวงของประเทศไทยคือเมืองใด?", options: ["เชียงใหม่", "ภูเก็ต", "กรุงเทพมหานคร", "ชลบุรี"], answer: 2 },
                { id: 103, question: "3. แม่น้ำสายใดเป็นแม่น้ำสายหลักของภาคกลาง?", options: ["แม่น้ำเจ้าพระยา", "แม่น้ำโขง", "แม่น้ำชี", "แม่น้ำตาปี"], answer: 0 },
                { id: 104, question: "4. สีประจำวันอาทิตย์คือสีอะไร?", options: ["สีเหลือง", "สีชมพู", "สีแดง", "สีเขียว"], answer: 2 },
                { id: 105, question: "5. สัตว์ชนิดใดเป็นสัตว์ประจำชาติไทย?", options: ["เสือ", "ช้าง", "ม้า", "ลิง"], answer: 1 }
            ]
        }
    ];

    let currentStageIndex = 0;
    let currentQuestionIndex = 0;
    let stageCorrectCount = 0;
    let stageWrongCount = 0;

    // บันทึกสถานะการตอบของแต่ละข้อป้องกันการคิดคะแนนซ้ำ { questionId: { selected: number, isCorrect: boolean } }
    let userAnswers = {};

    function initQuiz() {
        renderQuestion();
    }

    function renderQuestion() {
        const currentStage = quizData[currentStageIndex];
        const totalQuestions = currentStage.questions.length;
        const q = currentStage.questions[currentQuestionIndex];

        // 1. แสดงชื่อด่านและตำแหน่งข้อปัจจุบัน
        document.getElementById("stageTitle").innerText = currentStage.stageName;
        document.getElementById("questionNumber").innerText = `(ข้อที่ ${currentQuestionIndex + 1}/${totalQuestions})`;

        // 2. แสดงข้อความแจ้งเตือน/ให้กำลังใจ
        renderEncouragementMessage();

        // 3. แสดงคำถาม
        document.getElementById("questionText").innerText = q.question;

        // 4. แสดงตัวเลือก
        const optionsGroup = document.getElementById("optionsGroup");
        optionsGroup.innerHTML = "";

        const savedAnswer = userAnswers[q.id];

        q.options.forEach((optText, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optText;

            // หากเคยตอบข้อนี้ไปแล้ว ให้เฉลยและปิดการกดซ้ำ
            if (savedAnswer !== undefined) {
                btn.disabled = true;
                if (index === q.answer) {
                    btn.classList.add("correct");
                }
                if (index === savedAnswer.selected && !savedAnswer.isCorrect) {
                    btn.classList.add("wrong");
                }
            } else {
                btn.onclick = () => selectOption(index);
            }

            optionsGroup.appendChild(btn);
        });

        // 5. จัดการสถานะปุ่ม "ข้อก่อนหน้า" และ "ข้อถัดไป"
        document.getElementById("prevBtn").disabled = (currentQuestionIndex === 0);
        document.getElementById("nextBtn").disabled = (currentQuestionIndex === totalQuestions - 1);
    }

    function selectOption(selectedIndex) {
        const currentStage = quizData[currentStageIndex];
        const q = currentStage.questions[currentQuestionIndex];

        // ตรวจสอบความถูกต้อง
        const isCorrect = (selectedIndex === q.answer);

        // คำนวณเพิ่มคะแนนเฉพาะข้อที่ยังไม่เคยตอบ
        if (userAnswers[q.id] === undefined) {
            if (isCorrect) {
                stageCorrectCount++;
            } else {
                stageWrongCount++;
            }

            // บันทึกการตอบ
            userAnswers[q.id] = {
                selected: selectedIndex,
                isCorrect: isCorrect
            };
        }

        // แสดงผลใหม่ทันทีเพื่ออัปเดตสีและตัวเลขสถิติ
        renderQuestion();
    }

    function renderEncouragementMessage() {
        const container = document.getElementById("encouragementContainer");
        const totalAnswered = stageCorrectCount + stageWrongCount;

        if (totalAnswered === 0) {
            container.innerHTML = `<div class="encouragement-box info">🎯 เริ่มต้นสู้ๆ นะครับ! ด่านนี้ยังไม่ได้ตอบข้อไหนเลย</div>`;
            return;
        }

        const isHighWrong = stageWrongCount > stageCorrectCount && stageWrongCount >= 2;
        const isHighCorrect = (stageCorrectCount / totalAnswered) >= 0.7;

        if (isHighWrong) {
            container.innerHTML = `<div class="encouragement-box warn">⚠️ ตั้งใจหน่อยนะคุณ ผิดมา ${stageWrongCount} ข้อแล้ว (ถูก ${stageCorrectCount} ข้อ) พยายามอีกนิด!</div>`;
        } else if (isHighCorrect) {
            container.innerHTML = `<div class="encouragement-box good">🎉 เก่งมาก! คุณตอบถูกมาแล้ว ${stageCorrectCount} ข้อ (ผิด ${stageWrongCount} ข้อ) ทำดีแล้วขอให้ทำดีต่อไปครับ!</div>`;
        } else {
            container.innerHTML = `<div class="encouragement-box info">📊 คะแนนด่านนี้: ถูก ${stageCorrectCount} ข้อ | ผิด ${stageWrongCount} ข้อ</div>`;
        }
    }

    function nextQuestion() {
        const currentStage = quizData[currentStageIndex];
        if (currentQuestionIndex < currentStage.questions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    // เริ่มต้นทำงาน
    initQuiz();
</script>

</body>
</html>
